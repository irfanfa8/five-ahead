<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Five Ahead – Math Battle</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #F3F6FA;
    --grid: rgba(47, 91, 234, 0.08);
    --ink: #1B2233;
    --ink-soft: #5A6378;
    --p1: #2F5BEA;
    --p1-tint: #E3EAFE;
    --p2: #E8572A;
    --p2-tint: #FDE7DF;
    --good: #1E9E5A;
    --bad: #D7263D;
    --btn: #FFFFFF;
    --btn-edge: #D5DCE8;
    --veil: rgba(243, 246, 250, 0.94);
    color-scheme: light;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --paper: #121826;
      --grid: rgba(140, 165, 255, 0.07);
      --ink: #E8ECF4;
      --ink-soft: #9AA4BA;
      --p1: #6E8FFF;
      --p1-tint: #1C2648;
      --p2: #FF8A5C;
      --p2-tint: #3A2219;
      --good: #3DD68C;
      --bad: #FF5C70;
      --btn: #1B2335;
      --btn-edge: #2C3650;
      --veil: rgba(18, 24, 38, 0.95);
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --paper: #121826;
    --grid: rgba(140, 165, 255, 0.07);
    --ink: #E8ECF4;
    --ink-soft: #9AA4BA;
    --p1: #6E8FFF;
    --p1-tint: #1C2648;
    --p2: #FF8A5C;
    --p2-tint: #3A2219;
    --good: #3DD68C;
    --bad: #FF5C70;
    --btn: #1B2335;
    --btn-edge: #2C3650;
    --veil: rgba(18, 24, 38, 0.95);
    color-scheme: dark;
  }

  *, *::before, *::after { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background-color: var(--paper);
    background-image:
      linear-gradient(var(--grid) 1px, transparent 1px),
      linear-gradient(90deg, var(--grid) 1px, transparent 1px);
    background-size: 28px 28px;
    color: var(--ink);
    font-family: "Bricolage Grotesque", ui-rounded, "Segoe UI", system-ui, sans-serif;
    overflow: hidden;
    touch-action: manipulation;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
    -webkit-user-select: none;
  }

  /* ---------- Arena: the divider moves toward the trailing player ---------- */
  .arena {
    height: 100%;
    display: flex;
    flex-direction: row;
  }
  .panel {
    flex: 10 1 0;
    min-width: 0;
    min-height: 0;
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: clamp(12px, 3vmin, 32px);
    transition: flex-grow 450ms cubic-bezier(.2,.8,.2,1);
    overflow: hidden;
  }
  .panel.p1 { background: color-mix(in srgb, var(--p1-tint) 70%, transparent); }
  .panel.p2 { background: color-mix(in srgb, var(--p2-tint) 70%, transparent); }
  .panel.p1 + .panel.p2 { border-left: 4px solid var(--ink); }

  .panel-inner {
    width: 100%;
    max-width: 460px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: clamp(10px, 2.2vmin, 22px);
  }

  /* Portrait: face-to-face on one device, top player sees their half the right way up */
  @media (orientation: portrait) {
    .arena { flex-direction: column-reverse; }
    .panel.p1 + .panel.p2 { border-left: 0; border-bottom: 4px solid var(--ink); }
    .panel.p2 .panel-inner { transform: rotate(180deg); }
  }

  .phead {
    width: 100%;
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 12px;
  }
  .pname {
    font-weight: 600;
    font-size: clamp(1rem, 2.6vmin, 1.3rem);
  }
  .p1 .pname { color: var(--p1); }
  .p2 .pname { color: var(--p2); }
  .score {
    font-weight: 800;
    font-size: clamp(1.6rem, 5vmin, 2.6rem);
    font-variant-numeric: tabular-nums;
    line-height: 1;
  }
  .score.bump { animation: bump 300ms ease-out; }
  @keyframes bump { 40% { transform: scale(1.25); } }

  .pips {
    width: 100%;
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 6px;
  }
  .pip {
    height: 10px;
    border-radius: 5px;
    border: 2px solid var(--btn-edge);
    transition: background-color 250ms, border-color 250ms;
  }
  .p1 .pip.on { background: var(--p1); border-color: var(--p1); }
  .p2 .pip.on { background: var(--p2); border-color: var(--p2); }

  .question {
    font-weight: 800;
    font-size: clamp(2.4rem, 11vmin, 5.5rem);
    letter-spacing: -0.02em;
    line-height: 1.05;
    font-variant-numeric: tabular-nums;
    text-align: center;
    white-space: nowrap;
    padding: 0.1em 0;
  }
  .question .eq { color: var(--ink-soft); font-weight: 600; }

  .choices {
    width: 100%;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: clamp(8px, 1.6vmin, 14px);
  }
  .choice {
    font: inherit;
    font-weight: 800;
    font-size: clamp(1.5rem, 5.5vmin, 2.4rem);
    font-variant-numeric: tabular-nums;
    color: var(--ink);
    background: var(--btn);
    border: 3px solid var(--btn-edge);
    border-bottom-width: 6px;
    border-radius: 14px;
    padding: clamp(10px, 2.4vmin, 20px) 8px;
    cursor: pointer;
    position: relative;
    transition: transform 80ms, border-color 120ms, background-color 120ms;
  }
  .choice:active:not(:disabled) { transform: translateY(3px); border-bottom-width: 3px; }
  .p1 .choice:hover:not(:disabled) { border-color: var(--p1); }
  .p2 .choice:hover:not(:disabled) { border-color: var(--p2); }
  .choice:focus-visible { outline: 3px solid var(--ink); outline-offset: 3px; }
  .choice:disabled { cursor: default; }
  .choice.right { background: var(--good); border-color: var(--good); color: #fff; }
  .choice.wrong { background: var(--bad); border-color: var(--bad); color: #fff; }
  .key {
    position: absolute;
    top: 6px;
    left: 9px;
    font-size: 0.75rem;
    font-weight: 600;
    color: var(--ink-soft);
    display: none;
  }
  @media (hover: hover) and (pointer: fine) { .key { display: block; } }

  .flash-good { animation: good 450ms ease-out; }
  @keyframes good { 0% { box-shadow: inset 0 0 0 0 var(--good); } 30% { box-shadow: inset 0 0 0 10px var(--good); } 100% { box-shadow: inset 0 0 0 0 var(--good); } }
  .shake .panel-inner { animation: shake 380ms ease-in-out; }
  @media (orientation: portrait) { .p2.shake .panel-inner { animation-name: shake-flipped; } }
  @keyframes shake { 20%,60% { transform: translateX(-10px); } 40%,80% { transform: translateX(10px); } }
  @keyframes shake-flipped { 0%,100% { transform: rotate(180deg); } 20%,60% { transform: rotate(180deg) translateX(-10px); } 40%,80% { transform: rotate(180deg) translateX(10px); } }

  /* ---------- Overlays ---------- */
  .overlay {
    position: fixed;
    inset: 0;
    background: var(--veil);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    padding-top: calc(24px + env(safe-area-inset-top, 0px));
    padding-bottom: calc(24px + env(safe-area-inset-bottom, 0px));
    z-index: 20;
    overflow-y: auto;
  }
  .overlay[hidden] { display: none; }
  .card {
    max-width: 440px;
    width: 100%;
    text-align: center;
  }
  .title {
    font-weight: 800;
    font-size: clamp(3rem, 14vmin, 5.5rem);
    line-height: 0.9;
    letter-spacing: -0.04em;
    margin: 0 0 18px;
  }
  .title .t1 { color: var(--p1); display: block; }
  .title .t2 { color: var(--p2); display: block; }
  .lede {
    color: var(--ink-soft);
    font-size: 1.05rem;
    line-height: 1.5;
    margin: 0 auto 24px;
    max-width: 34ch;
  }
  .levels {
    display: inline-flex;
    border: 3px solid var(--ink);
    border-radius: 14px;
    overflow: hidden;
    margin-bottom: 22px;
  }
  .levels label { position: relative; }
  .levels input { position: absolute; opacity: 0; pointer-events: none; }
  .levels span {
    display: block;
    padding: 10px 18px;
    font-weight: 600;
    cursor: pointer;
  }
  .levels label + label span { border-left: 3px solid var(--ink); }
  .levels input:checked + span { background: var(--ink); color: var(--paper); }
  .levels input:focus-visible + span { outline: 3px solid var(--p1); outline-offset: -6px; }
  .level-note {
    color: var(--ink-soft);
    font-size: 0.95rem;
    margin: -10px 0 22px;
    min-height: 1.4em;
  }
  .actions { display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; }
  .btn {
    font: inherit;
    font-weight: 800;
    font-size: 1.2rem;
    padding: 14px 28px;
    border-radius: 14px;
    border: 3px solid var(--ink);
    border-bottom-width: 6px;
    background: var(--ink);
    color: var(--paper);
    cursor: pointer;
  }
  .btn.ghost { background: transparent; color: var(--ink); }
  .btn:active { transform: translateY(3px); border-bottom-width: 3px; }
  .btn:focus-visible { outline: 3px solid var(--p1); outline-offset: 3px; }
  .keys-hint {
    margin-top: 20px;
    color: var(--ink-soft);
    font-size: 0.9rem;
    display: none;
  }
  @media (hover: hover) and (pointer: fine) { .keys-hint { display: block; } }

  .winner {
    font-weight: 800;
    font-size: clamp(2.6rem, 11vmin, 4.5rem);
    line-height: 0.95;
    letter-spacing: -0.03em;
    margin: 0 0 12px;
  }
  .final {
    color: var(--ink-soft);
    font-size: 1.15rem;
    margin: 0 0 26px;
    font-variant-numeric: tabular-nums;
  }

  .countdown {
    position: fixed;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 30;
    pointer-events: none;
    font-weight: 800;
    font-size: clamp(6rem, 30vmin, 14rem);
    color: var(--ink);
  }
  .countdown[hidden] { display: none; }
  .countdown span { animation: pop 700ms ease-out both; }
  @keyframes pop { 0% { transform: scale(1.6); opacity: 0; } 30% { transform: scale(1); opacity: 1; } 100% { opacity: 0; } }

  @media (prefers-reduced-motion: reduce) {
    .panel { transition: none; }
    .shake .panel-inner, .score.bump, .flash-good, .countdown span { animation: none !important; }
  }
</style>
</head>
<body>

<main class="arena" id="arena" aria-label="Game board">
  <section class="panel p1" id="panel0" aria-label="Player 1">
    <div class="panel-inner">
      <div class="phead">
        <span class="pname">Player 1</span>
        <span class="score" aria-live="polite">0</span>
      </div>
      <div class="pips" aria-hidden="true"></div>
      <div class="question" aria-live="polite">&nbsp;</div>
      <div class="choices"></div>
    </div>
  </section>
  <section class="panel p2" id="panel1" aria-label="Player 2">
    <div class="panel-inner">
      <div class="phead">
        <span class="pname">Player 2</span>
        <span class="score" aria-live="polite">0</span>
      </div>
      <div class="pips" aria-hidden="true"></div>
      <div class="question" aria-live="polite">&nbsp;</div>
      <div class="choices"></div>
    </div>
  </section>
</main>

<div class="overlay" id="startScreen">
  <div class="card">
    <h1 class="title"><span class="t1">Five</span><span class="t2">Ahead</span></h1>
    <p class="lede">Each player gets their own questions. A right answer adds a point, a wrong one takes a point away. First to get five points ahead wins.</p>
    <div class="levels" role="radiogroup" aria-label="Difficulty">
      <label><input type="radio" name="level" value="easy"><span>Easy</span></label>
      <label><input type="radio" name="level" value="medium" checked><span>Medium</span></label>
      <label><input type="radio" name="level" value="hard"><span>Hard</span></label>
    </div>
    <p class="level-note" id="levelNote"></p>
    <div class="actions">
      <button class="btn" id="startBtn">Start game</button>
    </div>
    <p class="keys-hint">Keyboard: Player 1 uses 1 2 3 4, Player 2 uses 7 8 9 0.</p>
  </div>
</div>

<div class="overlay" id="winScreen" hidden>
  <div class="card">
    <h2 class="winner" id="winnerText">Player 1 wins</h2>
    <p class="final" id="finalScore"></p>
    <div class="actions">
      <button class="btn" id="againBtn">Play again</button>
      <button class="btn ghost" id="levelBtn">Change level</button>
    </div>
  </div>
</div>

<div class="countdown" id="countdown" hidden></div>

<script>
(function () {
  const WIN_LEAD = 5;
  const WRONG_LOCK_MS = 800;
  const P1_KEYS = ["1", "2", "3", "4"];
  const P2_KEYS = ["7", "8", "9", "0"];

  const LEVEL_NOTES = {
    easy: "Adding and subtracting up to 20",
    medium: "Adding, subtracting and times tables to 10",
    hard: "All four operations, bigger numbers"
  };

  const state = {
    level: "medium",
    scores: [0, 0],
    questions: [null, null],
    locked: [false, false],
    running: false
  };

  const panels = [document.getElementById("panel0"), document.getElementById("panel1")];
  const ui = panels.map((panel, p) => {
    const pips = panel.querySelector(".pips");
    for (let i = 0; i < WIN_LEAD; i++) {
      const d = document.createElement("span");
      d.className = "pip";
      pips.appendChild(d);
    }
    const choicesEl = panel.querySelector(".choices");
    const keys = p === 0 ? P1_KEYS : P2_KEYS;
    const buttons = keys.map((k, i) => {
      const b = document.createElement("button");
      b.className = "choice";
      b.type = "button";
      b.innerHTML = '<span class="key">' + k + '</span><span class="val"></span>';
      b.addEventListener("pointerdown", (e) => { e.preventDefault(); answer(p, i); });
      b.addEventListener("keydown", (e) => {
        if (e.key === "Enter" || e.key === " ") { e.preventDefault(); answer(p, i); }
      });
      choicesEl.appendChild(b);
      return b;
    });
    return {
      panel,
      score: panel.querySelector(".score"),
      question: panel.querySelector(".question"),
      pips: Array.from(pips.children),
      buttons
    };
  });

  // ---------- Question generation ----------
  const rand = (min, max) => Math.floor(Math.random() * (max - min + 1)) + min;
  const pick = (arr) => arr[rand(0, arr.length - 1)];

  function makeQuestion(level) {
    let a, b, op, ans;
    if (level === "easy") {
      op = pick(["+", "−"]);
      if (op === "+") { a = rand(1, 10); b = rand(1, 10); ans = a + b; }
      else { a = rand(2, 20); b = rand(1, a); ans = a - b; }
    } else if (level === "medium") {
      op = pick(["+", "−", "×"]);
      if (op === "+") { a = rand(10, 50); b = rand(5, 49); ans = a + b; }
      else if (op === "−") { a = rand(15, 60); b = rand(5, a); ans = a - b; }
      else { a = rand(2, 10); b = rand(2, 10); ans = a * b; }
    } else {
      op = pick(["+", "−", "×", "÷"]);
      if (op === "+") { a = rand(25, 99); b = rand(25, 99); ans = a + b; }
      else if (op === "−") { a = rand(40, 150); b = rand(15, a); ans = a - b; }
      else if (op === "×") { a = rand(3, 12); b = rand(3, 12); ans = a * b; }
      else { b = rand(2, 12); ans = rand(2, 12); a = b * ans; }
    }
    return { text: a + " " + op + " " + b, answer: ans, options: makeOptions(ans, op) };
  }

  function makeOptions(ans, op) {
    const set = new Set([ans]);
    const spread = op === "×" ? [1, 2, 3, 10] : [1, 2, 3, 10];
    let guard = 0;
    while (set.size < 4 && guard++ < 100) {
      let off = pick(spread) * (Math.random() < 0.5 ? -1 : 1);
      if (op === "×" && Math.random() < 0.4) off = pick([-1, 1]) * rand(3, 12);
      const c = ans + off;
      if (c >= 0) set.add(c);
    }
    let n = ans + 4;
    while (set.size < 4) set.add(n++);
    const arr = Array.from(set);
    for (let i = arr.length - 1; i > 0; i--) {
      const j = rand(0, i);
      [arr[i], arr[j]] = [arr[j], arr[i]];
    }
    return arr;
  }

  // ---------- Rendering ----------
  function showQuestion(p) {
    const q = makeQuestion(state.level);
    state.questions[p] = q;
    state.locked[p] = false;
    ui[p].question.innerHTML = q.text + ' <span class="eq">=</span> ?';
    ui[p].buttons.forEach((b, i) => {
      b.classList.remove("right", "wrong");
      b.disabled = false;
      b.querySelector(".val").textContent = q.options[i];
      b.setAttribute("aria-label", "Answer " + q.options[i]);
    });
  }

  function renderBoard() {
    const lead = state.scores[0] - state.scores[1];
    const shift = 1.25 * lead;
    panels[0].style.flexGrow = String(10 + shift);
    panels[1].style.flexGrow = String(10 - shift);
    [0, 1].forEach((p) => {
      ui[p].score.textContent = state.scores[p];
      const myLead = p === 0 ? lead : -lead;
      ui[p].pips.forEach((pip, i) => pip.classList.toggle("on", i < myLead));
    });
  }

  function restartAnim(el, cls) {
    el.classList.remove(cls);
    void el.offsetWidth;
    el.classList.add(cls);
  }

  // ---------- Game flow ----------
  function answer(p, i) {
    if (!state.running || state.locked[p]) return;
    const q = state.questions[p];
    const chosen = q.options[i];
    if (chosen === q.answer) {
      state.scores[p] += 1;
      restartAnim(ui[p].panel, "flash-good");
      restartAnim(ui[p].score, "bump");
      renderBoard();
      if (checkWin()) return;
      showQuestion(p);
    } else {
      state.scores[p] -= 1;
      state.locked[p] = true;
      ui[p].buttons.forEach((b, j) => {
        b.disabled = true;
        if (j === i) b.classList.add("wrong");
        if (q.options[j] === q.answer) b.classList.add("right");
      });
      restartAnim(ui[p].panel, "shake");
      restartAnim(ui[p].score, "bump");
      renderBoard();
      if (checkWin()) return;
      setTimeout(() => { if (state.running) showQuestion(p); }, WRONG_LOCK_MS);
    }
  }

  function checkWin() {
    const lead = state.scores[0] - state.scores[1];
    if (Math.abs(lead) < WIN_LEAD) return false;
    state.running = false;
    const w = lead > 0 ? 0 : 1;
    const winnerText = document.getElementById("winnerText");
    winnerText.textContent = "Player " + (w + 1) + " wins";
    winnerText.style.color = w === 0 ? "var(--p1)" : "var(--p2)";
    document.getElementById("finalScore").textContent =
      "Final score " + state.scores[0] + " to " + state.scores[1];
    ui.forEach((u) => u.buttons.forEach((b) => (b.disabled = true)));
    setTimeout(() => {
      document.getElementById("winScreen").hidden = false;
      document.getElementById("againBtn").focus();
    }, 550);
    return true;
  }

  function startGame() {
    state.scores = [0, 0];
    state.running = false;
    document.getElementById("startScreen").hidden = true;
    document.getElementById("winScreen").hidden = true;
    renderBoard();
    ui.forEach((u) => {
      u.question.innerHTML = "&nbsp;";
      u.buttons.forEach((b) => { b.disabled = true; b.classList.remove("right", "wrong"); b.querySelector(".val").textContent = ""; });
    });
    countdown(() => {
      state.running = true;
      showQuestion(0);
      showQuestion(1);
    });
  }

  function countdown(done) {
    const el = document.getElementById("countdown");
    const reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    if (reduce) { done(); return; }
    const steps = ["3", "2", "1"];
    el.hidden = false;
    let i = 0;
    const tick = () => {
      if (i >= steps.length) { el.hidden = true; el.innerHTML = ""; done(); return; }
      el.innerHTML = "<span>" + steps[i] + "</span>";
      i++;
      setTimeout(tick, 650);
    };
    tick();
  }

  // ---------- Controls ----------
  const levelNote = document.getElementById("levelNote");
  const levelInputs = document.querySelectorAll('input[name="level"]');
  levelInputs.forEach((inp) => inp.addEventListener("change", () => {
    state.level = inp.value;
    levelNote.textContent = LEVEL_NOTES[state.level];
  }));
  levelNote.textContent = LEVEL_NOTES[state.level];

  document.getElementById("startBtn").addEventListener("click", startGame);
  document.getElementById("againBtn").addEventListener("click", startGame);
  document.getElementById("levelBtn").addEventListener("click", () => {
    document.getElementById("winScreen").hidden = true;
    document.getElementById("startScreen").hidden = false;
    document.getElementById("startBtn").focus();
  });

  document.addEventListener("keydown", (e) => {
    if (e.repeat || !state.running) return;
    const i1 = P1_KEYS.indexOf(e.key);
    if (i1 !== -1) { answer(0, i1); return; }
    const i2 = P2_KEYS.indexOf(e.key);
    if (i2 !== -1) answer(1, i2);
  });

  renderBoard();
})();
</script>
</body>
</html>
